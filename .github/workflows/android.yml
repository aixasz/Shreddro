name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# contents: write lets the release step attach APKs to tag releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Repo ships no wrapper binary; generate one pinned to 8.7.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Core unit tests
        run: ./gradlew :core:test

      # OAuth client ids are identifiers, not secrets (they're bound to the
      # package + signing cert), but Secrets keep them out of the repo.
      # Apps Script config is a runtime in-app setting — CI never needs it
      # and no secret value ships inside the APK. Parsing is 100% on-device.
      - name: Assemble debug APK
        run: >
          ./gradlew :app:assembleDebug
          -Pshreddro.googleClientId="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          -Pshreddro.msClientId="${{ secrets.MS_OAUTH_CLIENT_ID }}"

      - name: Assemble release APK (unsigned unless keystore secret set)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          CLIENT_PROPS=(-Pshreddro.googleClientId="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
                        -Pshreddro.msClientId="${{ secrets.MS_OAUTH_CLIENT_ID }}")
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            ./gradlew :app:assembleRelease "${CLIENT_PROPS[@]}" \
              -Pshreddro.storeFile="$PWD/release.keystore" \
              -Pshreddro.storePassword="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              -Pshreddro.keyAlias="${{ secrets.RELEASE_KEY_ALIAS }}" \
              -Pshreddro.keyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            ./gradlew :app:assembleRelease "${CLIENT_PROPS[@]}"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shreddro-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shreddro-release
          path: app/build/outputs/apk/release/*.apk

      # Tag pushes (v1.0.0 …) publish the APKs as a GitHub Release —
      # the simplest install channel for your device and early users.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

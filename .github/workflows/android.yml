name: Release CI

# Branch strategy (see CLAUDE.md — the project constitution):
#   feature/* ──merge──► dev ──cut──► release/vX.Y.Z ──CI──► main
#
# CI runs ONLY when a release/vX.Y.Z branch is pushed. Day-to-day commits and
# bug fixes are verified locally (unit tests + USB remote debugging) and do
# not trigger builds. On success CI publishes the tagged GitHub Release with
# signed APKs and merges the release branch into main — main only ever holds
# released, CI-verified code.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the merge into main can push

      - name: Derive version from branch name
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Branch must be named release/vX.Y.Z (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Repo ships no wrapper binary; generate one pinned to 8.7.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Core unit tests
        run: ./gradlew :core:test

      # OAuth client ids are identifiers, not secrets (bound to package +
      # signing cert), but Secrets keep them out of the repo. Apps Script
      # config is a runtime in-app setting; parsing is 100% on-device.
      - name: Assemble debug APK
        run: >
          ./gradlew :app:assembleDebug
          -Pshreddro.googleClientId="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          -Pshreddro.msClientId="${{ secrets.MS_OAUTH_CLIENT_ID }}"

      - name: Assemble release APK (signed when keystore secret set)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          CLIENT_PROPS=(-Pshreddro.googleClientId="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
                        -Pshreddro.msClientId="${{ secrets.MS_OAUTH_CLIENT_ID }}")
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            ./gradlew :app:assembleRelease "${CLIENT_PROPS[@]}" \
              -Pshreddro.storeFile="$PWD/release.keystore" \
              -Pshreddro.storePassword="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              -Pshreddro.keyAlias="${{ secrets.RELEASE_KEY_ALIAS }}" \
              -Pshreddro.keyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            ./gradlew :app:assembleRelease "${CLIENT_PROPS[@]}"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shreddro-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # The gate passed: fold this release into main. main therefore only
      # ever contains code that shipped.
      - name: Merge release branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/$GITHUB_REF_NAME" \
            -m "Merge $GITHUB_REF_NAME into main (CI-verified release ${{ steps.ver.outputs.version }})"
          git push origin main
